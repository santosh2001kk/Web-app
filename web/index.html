<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Panel Detector</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3d;
    --accent: #3b82f6; --accent2: #10b981; --text: #e2e8f0; --muted: #64748b;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; background: var(--surface);
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header span { font-size: 12px; color: var(--muted); padding: 2px 8px; border: 1px solid var(--border); border-radius: 99px; }
  .main { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 57px); }

  /* Sidebar */
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
  .drop-zone {
    margin: 16px; border: 2px dashed var(--border); border-radius: 12px;
    padding: 28px 16px; text-align: center; cursor: pointer;
    transition: border-color 0.2s, background 0.2s; position: relative;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: #1e2a3a; }
  .drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop-zone .icon { font-size: 28px; margin-bottom: 6px; }
  .drop-zone p { font-size: 12px; color: var(--muted); }
  .drop-zone p strong { color: var(--text); }
  .section { padding: 0 16px 14px; }
  .btn {
    display: block; width: 100%; padding: 11px; background: var(--accent);
    color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.secondary {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-size: 12px; padding: 8px; margin-top: 8px;
  }
  .btn.secondary:hover { border-color: var(--accent); color: var(--text); opacity: 1; }
  .btn.active-zone { border-color: #f59e0b; color: #f59e0b; background: #1a150a; }
  .zone-hint {
    margin: 0 16px 12px; padding: 10px 12px; border-radius: 8px;
    background: #1a1f0e; border: 1px solid #3a4a1a; font-size: 12px; color: #a3c44a;
    display: none;
  }
  .zone-hint.show { display: block; }
  .spinner {
    display: none; width: 18px; height: 18px; border: 2px solid #ffffff40;
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #results-panel { padding: 16px; flex: 1; overflow-y: auto; }
  #results-panel h3 { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  .detection-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .detection-card:hover { border-color: var(--accent); }
  .detection-card.highlighted { border-color: var(--accent); background: #1e2a3a; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .card-body { flex: 1; min-width: 0; }
  .card-label { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-right: 4px; }
  .badge-comp { background: #1e3a5f; color: #60a5fa; }
  .badge-struct { background: #1a3325; color: #34d399; }
  .summary-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 12px; color: var(--muted); line-height: 1.6; }

  /* Canvas */
  .canvas-area { display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; background: var(--bg); }
  .canvas-wrap { position: relative; display: inline-block; }
  #main-canvas { display: block; border-radius: 8px; max-width: 100%; max-height: calc(100vh - 105px); }
  #overlay-canvas { position: absolute; top: 0; left: 0; border-radius: 8px; }
  .empty-state { text-align: center; color: var(--muted); }
  .empty-state .big { font-size: 56px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }
  .status-bar {
    position: fixed; bottom: 16px; right: 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px;
    font-size: 12px; color: var(--muted); display: none; align-items: center; gap: 8px;
  }
  .status-bar.show { display: flex; }
  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 50vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Panel Detector</h1>
  <span>Gemini AI</span>
</header>

<div class="main">
  <aside class="sidebar">
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept="image/*"/>
      <div class="icon">📷</div>
      <p><strong>Click or drag</strong> an image here</p>
      <p>JPG, PNG, WEBP — up to 20MB</p>
    </div>

    <div class="zone-hint" id="zone-hint">
      Draw a rectangle on the image to set the work zone, then click Detect.
    </div>

    <div class="section">
      <button class="btn secondary" id="zone-btn" disabled>Draw Work Zone</button>
      <button class="btn secondary" id="clear-zone-btn" style="display:none">Clear Zone</button>
    </div>

    <div class="section">
      <button class="btn" id="detect-btn" disabled>
        <span id="btn-text">Detect Components</span>
        <div class="spinner" id="btn-spinner"></div>
      </button>
    </div>

    <div id="results-panel">
      <div id="results-content"></div>
    </div>
  </aside>

  <main class="canvas-area" id="canvas-area">
    <div class="empty-state" id="empty-state">
      <div class="big">⚡</div>
      <p>Upload a panel image to start detection</p>
    </div>
    <div class="canvas-wrap" id="canvas-wrap" style="display:none">
      <canvas id="main-canvas"></canvas>
      <canvas id="overlay-canvas"></canvas>
    </div>
  </main>
</div>

<div class="status-bar" id="status-bar">
  <div class="spinner" style="display:block;border-color:#3b82f640;border-top-color:#3b82f6"></div>
  <span id="status-text">Analysing panel…</span>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let currentBase64 = null;
let detections = [];
let workZone = null;        // {ymin, xmin, ymax, xmax} in 0-1000
let drawingZone = false;    // user is currently in "draw mode"
let dragStart = null;       // {x, y} in canvas pixels while dragging

// ── Colours ─────────────────────────────────────────────────────────────────
const PALETTE = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#6366f1'];
function colorFor(idx, alpha = 1) {
  const hex = PALETTE[idx % PALETTE.length];
  if (alpha === 1) return hex;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── DOM refs ─────────────────────────────────────────────────────────────────
const dropZone    = document.getElementById('drop-zone');
const fileInput   = document.getElementById('file-input');
const detectBtn   = document.getElementById('detect-btn');
const zoneBtn     = document.getElementById('zone-btn');
const clearZoneBtn= document.getElementById('clear-zone-btn');
const zoneHint    = document.getElementById('zone-hint');
const mainCanvas  = document.getElementById('main-canvas');
const overlayCanvas = document.getElementById('overlay-canvas');
const canvasWrap  = document.getElementById('canvas-wrap');
const emptyState  = document.getElementById('empty-state');
const mainCtx     = mainCanvas.getContext('2d');
const overlayCtx  = overlayCanvas.getContext('2d');

// ── File upload ──────────────────────────────────────────────────────────────
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    currentBase64 = e.target.result;
    loadImageToCanvas(currentBase64);
    detections = []; workZone = null; drawingZone = false;
    document.getElementById('results-content').innerHTML = '';
    detectBtn.disabled = false;
    zoneBtn.disabled = false;
    zoneBtn.classList.remove('active-zone');
    clearZoneBtn.style.display = 'none';
    zoneHint.classList.remove('show');
  };
  reader.readAsDataURL(file);
}

// ── Canvas setup ─────────────────────────────────────────────────────────────
function loadImageToCanvas(src) {
  const img = new Image();
  img.onload = () => {
    const maxW = document.getElementById('canvas-area').clientWidth - 48;
    const maxH = window.innerHeight - 105;
    const scale = Math.min(maxW / img.width, maxH / img.height, 1);
    mainCanvas.width  = Math.round(img.width  * scale);
    mainCanvas.height = Math.round(img.height * scale);
    overlayCanvas.width  = mainCanvas.width;
    overlayCanvas.height = mainCanvas.height;
    overlayCanvas.style.width  = mainCanvas.width  + 'px';
    overlayCanvas.style.height = mainCanvas.height + 'px';
    mainCtx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
    emptyState.style.display = 'none';
    canvasWrap.style.display = 'inline-block';
    redraw();
  };
  img.src = src;
}

// ── Coordinate helpers ────────────────────────────────────────────────────────
function n2px(v, dim) { return (v / 1000) * dim; }
function px2n(v, dim) { return Math.round((v / dim) * 1000); }

function canvasPos(e) {
  const rect = overlayCanvas.getBoundingClientRect();
  const scaleX = overlayCanvas.width  / rect.width;
  const scaleY = overlayCanvas.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

// ── Work zone drawing ─────────────────────────────────────────────────────────
zoneBtn.addEventListener('click', () => {
  drawingZone = !drawingZone;
  zoneBtn.classList.toggle('active-zone', drawingZone);
  overlayCanvas.style.cursor = drawingZone ? 'crosshair' : 'default';
  zoneHint.classList.toggle('show', drawingZone);
  if (drawingZone) { workZone = null; clearZoneBtn.style.display = 'none'; redraw(); }
});

clearZoneBtn.addEventListener('click', () => {
  workZone = null; drawingZone = false;
  zoneBtn.classList.remove('active-zone');
  overlayCanvas.style.cursor = 'default';
  clearZoneBtn.style.display = 'none';
  zoneHint.classList.remove('show');
  redraw();
});

overlayCanvas.addEventListener('mousedown', e => {
  if (!drawingZone) return;
  dragStart = canvasPos(e);
});

overlayCanvas.addEventListener('mousemove', e => {
  if (!drawingZone || !dragStart) return;
  const pos = canvasPos(e);
  redraw();
  // Draw live preview
  const x = Math.min(dragStart.x, pos.x), y = Math.min(dragStart.y, pos.y);
  const w = Math.abs(pos.x - dragStart.x), h = Math.abs(pos.y - dragStart.y);
  drawZoneRect(x, y, w, h);
});

overlayCanvas.addEventListener('mouseup', e => {
  if (!drawingZone || !dragStart) return;
  const pos = canvasPos(e);
  const x1 = Math.min(dragStart.x, pos.x), y1 = Math.min(dragStart.y, pos.y);
  const x2 = Math.max(dragStart.x, pos.x), y2 = Math.max(dragStart.y, pos.y);
  if (x2 - x1 > 10 && y2 - y1 > 10) {
    workZone = {
      ymin: px2n(y1, overlayCanvas.height),
      xmin: px2n(x1, overlayCanvas.width),
      ymax: px2n(y2, overlayCanvas.height),
      xmax: px2n(x2, overlayCanvas.width),
    };
    drawingZone = false;
    zoneBtn.classList.remove('active-zone');
    overlayCanvas.style.cursor = 'default';
    zoneHint.classList.remove('show');
    clearZoneBtn.style.display = 'block';
  }
  dragStart = null;
  redraw();
});

function safetyBuffer(z, pad = 80) {
  return {
    ymin: Math.max(0,    z.ymin - pad),
    xmin: Math.max(0,    z.xmin - pad),
    ymax: Math.min(1000, z.ymax + pad),
    xmax: Math.min(1000, z.xmax + pad),
  };
}

// Touch support
overlayCanvas.addEventListener('touchstart', e => { e.preventDefault(); if (!drawingZone) return; dragStart = canvasPos(e.touches[0]); }, { passive: false });
overlayCanvas.addEventListener('touchmove',  e => { e.preventDefault(); if (!drawingZone || !dragStart) return; const pos = canvasPos(e.touches[0]); redraw(); drawZoneRect(Math.min(dragStart.x,pos.x), Math.min(dragStart.y,pos.y), Math.abs(pos.x-dragStart.x), Math.abs(pos.y-dragStart.y)); }, { passive: false });
overlayCanvas.addEventListener('touchend',   e => { e.preventDefault(); overlayCanvas.dispatchEvent(new MouseEvent('mouseup', { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY })); }, { passive: false });

function drawZoneRect(x, y, w, h) {
  overlayCtx.save();
  overlayCtx.fillStyle = 'rgba(245,158,11,0.12)';
  overlayCtx.fillRect(x, y, w, h);
  overlayCtx.strokeStyle = '#f59e0b';
  overlayCtx.lineWidth = 2;
  overlayCtx.setLineDash([10, 5]);
  overlayCtx.strokeRect(x, y, w, h);
  overlayCtx.setLineDash([]);
  overlayCtx.font = 'bold 12px Inter,system-ui,sans-serif';
  overlayCtx.fillStyle = '#f59e0b';
  overlayCtx.fillText('WORK ZONE', x + 6, y + 18);
  overlayCtx.restore();
}

// ── Redraw overlay ────────────────────────────────────────────────────────────
function redraw(highlight = -1) {
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

  // Safety buffer (red dashed, drawn first so work zone is on top)
  if (workZone) {
    const sb = safetyBuffer(workZone);
    const sx = n2px(sb.xmin, overlayCanvas.width),  sy = n2px(sb.ymin, overlayCanvas.height);
    const sw = n2px(sb.xmax - sb.xmin, overlayCanvas.width), sh = n2px(sb.ymax - sb.ymin, overlayCanvas.height);
    overlayCtx.save();
    overlayCtx.fillStyle = 'rgba(239,68,68,0.06)';
    overlayCtx.fillRect(sx, sy, sw, sh);
    overlayCtx.strokeStyle = '#ef4444';
    overlayCtx.lineWidth = 1.5;
    overlayCtx.setLineDash([6, 4]);
    overlayCtx.strokeRect(sx, sy, sw, sh);
    overlayCtx.setLineDash([]);
    overlayCtx.font = '10px Inter,system-ui,sans-serif';
    overlayCtx.fillStyle = '#ef4444';
    overlayCtx.fillText('SAFETY BUFFER', sx + 4, sy + 13);
    overlayCtx.restore();
  }

  // Work zone (yellow solid)
  if (workZone) {
    const x = n2px(workZone.xmin, overlayCanvas.width);
    const y = n2px(workZone.ymin, overlayCanvas.height);
    const w = n2px(workZone.xmax - workZone.xmin, overlayCanvas.width);
    const h = n2px(workZone.ymax - workZone.ymin, overlayCanvas.height);
    drawZoneRect(x, y, w, h);
  }

  // Detections
  detections.forEach((d, i) => {
    const [yn, xn, yx, xx] = d.box_2d;
    const x = n2px(xn, overlayCanvas.width),  y = n2px(yn, overlayCanvas.height);
    const w = n2px(xx - xn, overlayCanvas.width), h = n2px(yx - yn, overlayCanvas.height);
    if (w < 2 || h < 2) return;
    const col = colorFor(i);
    const isStruct = d.category === 'structure';
    const alpha = (highlight === -1 || highlight === i) ? 0.18 : 0.05;
    overlayCtx.fillStyle = colorFor(i, alpha);
    overlayCtx.fillRect(x, y, w, h);
    overlayCtx.strokeStyle = col;
    overlayCtx.lineWidth = highlight === i ? 3 : 2;
    overlayCtx.setLineDash(isStruct ? [8, 4] : []);
    overlayCtx.strokeRect(x, y, w, h);
    overlayCtx.setLineDash([]);
    const tag = [d.label, d.rating, d.brand].filter(Boolean).join(' · ');
    overlayCtx.font = 'bold 11px Inter,system-ui,sans-serif';
    const tw = overlayCtx.measureText(tag).width + 10;
    overlayCtx.fillStyle = col;
    overlayCtx.fillRect(x, y, tw, 18);
    overlayCtx.fillStyle = '#fff';
    overlayCtx.fillText(tag, x + 5, y + 13);
  });
}

// ── Detect ────────────────────────────────────────────────────────────────────
detectBtn.addEventListener('click', async () => {
  if (!currentBase64) return;
  setLoading(true);
  try {
    const base64 = currentBase64.split(',')[1] || currentBase64;
    const body = { image: base64 };
    if (workZone) { body.workZone = workZone; body.safetyBuffer = safetyBuffer(workZone); }
    const res = await fetch('/api/detect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    detections = data.detections || [];
    renderResults(data);
    redraw();
  } catch (err) {
    alert('Detection failed: ' + err.message);
  } finally {
    setLoading(false);
  }
});

function setLoading(on) {
  detectBtn.disabled = on;
  document.getElementById('btn-text').style.display = on ? 'none' : 'block';
  document.getElementById('btn-spinner').style.display = on ? 'block' : 'none';
  document.getElementById('status-bar').classList.toggle('show', on);
}

// ── Results ───────────────────────────────────────────────────────────────────
function renderResults(data) {
  const el = document.getElementById('results-content');
  el.innerHTML = '';
  if (data.summary) el.innerHTML += `<div class="summary-box">${data.summary}</div>`;
  if (!detections.length) { el.innerHTML += '<p style="color:var(--muted);font-size:13px">No components detected.</p>'; return; }
  el.innerHTML += `<h3>${detections.length} detection${detections.length > 1 ? 's' : ''}${workZone ? ' in work zone' : ''}</h3>`;
  detections.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'detection-card';
    const isStruct = d.category === 'structure';
    const meta = [d.type_detail, d.rating, d.brand, d.estimated_dimensions].filter(Boolean).join(' · ');
    card.innerHTML = `
      <div class="dot" style="background:${colorFor(i)}"></div>
      <div class="card-body">
        <div class="card-label">${d.label}</div>
        <div class="card-meta"><span class="badge ${isStruct ? 'badge-struct' : 'badge-comp'}">${d.category}</span>${meta}</div>
      </div>`;
    card.addEventListener('mouseenter', () => redraw(i));
    card.addEventListener('mouseleave', () => redraw());
    card.addEventListener('click', () => {
      document.querySelectorAll('.detection-card').forEach(c => c.classList.remove('highlighted'));
      card.classList.add('highlighted');
    });
    el.appendChild(card);
  });
}
</script>
</body>
</html>
